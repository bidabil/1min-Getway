
# ============================================================
# pyproject.toml - Configuration centralisée des outils
# ============================================================

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "1min-gateway"
version = "1.0.0"
description = "1min-Gateway: Intelligent API Gateway for AI models"
authors = [
    {name = "Billel Attafi", email = "billel@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["gateway", "api", "ai", "llm", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# ============================================================
# BLACK - Code formatter (gardé pour compatibilité)
# ============================================================
[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.eggs
  | \.tox
  | \.pytest_cache
  | \.mypy_cache
  | __pycache__
  | logs
  | dist
  | build
)/
'''

# ============================================================
# ISORT - Import sorting (gardé pour compatibilité)
# ============================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "logs",
]

# ============================================================
# PYTEST - Test framework
# ============================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=75",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::FutureWarning:mistral_common.*",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "**/.venv/*",
    "**/venv/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ============================================================
# BANDIT - Security linter (gardé pour compatibilité)
# ============================================================
[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "logs",
    "__pycache__",
]
skips = ["B101"]

# ============================================================
# MYPY - Static type checker
# ============================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "tests",
    "logs",
]

# ============================================================
# RUFF - Linter moderne (remplace Flake8)
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "logs",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (sécurité)
]
ignore = [
    "E501",   # line too long (géré par formatter)
    "B008",   # function calls in argument defaults
    "S101",   # assert (OK dans tests)
    "S104",   # binding to 0.0.0.0 (nécessaire pour Docker)
    "S105",   # hardcoded password (faux positif - valeur par défaut)
    "UP007",  # Union[X, Y] -> X | Y (garde compatibilité)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "S105", "S106", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# COMMITIZEN
# ============================================================
[tool.commitizen]
name = "cz_gitmoji"
version = "1.0.0"
tag_format = "v$version"
update_changelog_on_bump = true
bump_message = "🔖 chore(release): bump version $current_version → $new_version [skip ci]"
