# ==============================================================
# pyproject.toml - 1min-Gateway
# ==============================================================

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "1min-gateway"
version = "2.0.0"
description = "OpenAI- and Anthropic-compatible gateway and MCP server for 1min.ai"
authors = [{ name = "Billel Attafi" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["gateway", "api", "ai", "llm", "proxy", "openai", "anthropic", "mcp", "1min.ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gateway = ["infrastructure/one_min/data/*.json", "py.typed"]

# ==============================================================
# PYTEST
# ==============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: tests that exercise the HTTP application end to end (upstream mocked)",
]

[tool.coverage.run]
source = ["src/gateway"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ==============================================================
# MYPY
# ==============================================================
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "tests"]

# ==============================================================
# RUFF
# ==============================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "ASYNC", # flake8-async
]
ignore = [
    "E501", # line length is handled by the formatter
    "B008", # FastAPI dependencies are function calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["gateway"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
