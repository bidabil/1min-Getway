
# ============================================================
# Dependabot Configuration
# ============================================================

version: 2

updates:
  # ============================================================
  # PYTHON DEPENDENCIES
  # ============================================================
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "billelattafi"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

    # Groupes SANS chevauchement
    groups:
      # Dépendances de production
      production-core:
        patterns:
          - "flask*"
          - "waitress*"
          - "requests*"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"

      # Tokenization
      tokenization:
        patterns:
          - "tiktoken*"
          - "mistral*"
        update-types:
          - "minor"
          - "patch"

      # Outils de développement
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff"
          - "pre-commit"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "flask"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tiktoken"
        update-types: ["version-update:semver-major"]

    # versioning-strategy non définie → comportement par défaut "auto".
    # "increase" était utilisé mais élargit les contraintes de version sans lockfile
    # pour valider les bornes. "lockfile-only" nécessiterait un poetry.lock ou pip-tools.
    # Si un lockfile est ajouté plus tard, passer à "lockfile-only".

  # ============================================================
  # GITHUB ACTIONS
  # ============================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    reviewers:
      - "billelattafi"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Actions GitHub core (checkout, setup-python, cache, upload-artifact)
      # Regroupées car elles changent ensemble et sont basses en risque
      github-actions-core:
        patterns:
          - "actions/*"
        update-types:
          - "minor"
          - "patch"

      # Actions de sécurité — regroupées séparément pour review dédiée
      # Une cassure ici impacte directement la supply chain
      github-actions-security:
        patterns:
          - "aquasecurity/*"
          - "anchore/*"
          - "sigstore/*"
          - "ossf/*"
          - "github/codeql-action"
          - "semgrep/*"
          - "google/osv-scanner-action"
        update-types:
          - "minor"
          - "patch"

      # Reste des actions (docker, semantic-release, test-summary, etc.)
      github-actions-other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ============================================================
  # DOCKER
  # ============================================================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "billelattafi"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
