
# ============================================================
# Dependabot Configuration - Corrigé
# ============================================================

version: 2

updates:
  # ============================================================
  # PYTHON DEPENDENCIES
  # ============================================================
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "billelattafi"
    commit-message:
      prefix: "⬆️ chore(deps)"
      prefix-development: "⬆️ chore(deps-dev)"
      include: "scope"

    # Groupes SANS chevauchement
    groups:
      # Dépendances de production
      production-core:
        patterns:
          - "flask*"
          - "waitress*"
          - "requests*"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"

      # Tokenization
      tokenization:
        patterns:
          - "tiktoken*"
          - "mistral*"
        update-types:
          - "minor"
          - "patch"

      # Outils de développement
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff"
          - "pre-commit"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "flask"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tiktoken"
        update-types: ["version-update:semver-major"]

    versioning-strategy: increase

  # ============================================================
  # GITHUB ACTIONS
  # ============================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    reviewers:
      - "billelattafi"
    commit-message:
      prefix: "⬆️ chore(ci)"
      include: "scope"
    groups:
      github-actions-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ============================================================
  # DOCKER
  # ============================================================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "billelattafi"
    commit-message:
      prefix: "⬆️ chore(docker)"
      include: "scope"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
