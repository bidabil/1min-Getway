# ==============================================================
# CD Staging Pipeline - 1min-Gateway
# ==============================================================
# Déploiement automatique sur l'environnement staging
# - Déclenché après la réussite du workflow CI sur main
# - Semantic release + smoke tests
# ==============================================================

name: CD - Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Ne pas annuler un déploiement en cours

env:
  REGISTRY_GHCR: ghcr.io
  GHCR_IMAGE: ${{ github.repository_owner }}/1min-gateway
  STAGING_URL: ${{ vars.STAGING_URL }}

permissions:
  contents: write        # semantic-release crée des tags/releases
  packages: write        # push images Docker
  issues: write          # semantic-release commente les issues
  pull-requests: write   # semantic-release + dependency-review
  security-events: write # CodeQL, OSV Scanner, Trivy
  actions: read          # OSV Scanner
  id-token: write        # Cosign (signature keyless) + attestations
  attestations: write    # build provenance

jobs:
  # ==============================================================
  # GUARD: Ne s'exécute que si CI a réussi
  # ==============================================================
  guard:
    name: "Check CI Result"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}
    steps:
      - name: Compute short SHA
        id: sha
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha_short=${SHA:0:7}" >> $GITHUB_OUTPUT

  # ==============================================================
  # STAGE 1: RELEASE (Semantic Release)
  # ==============================================================
  release:
    name: "Semantic Release"
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            semantic-release-gitmoji
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "## New Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_STEP_SUMMARY

  # ==============================================================
  # STAGE 2: DEPLOY STAGING
  # ==============================================================
  deploy-staging:
    name: "Deploy Staging"
    needs: [guard, release]
    if: |
      always() && !cancelled() &&
      needs.guard.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    permissions:
      contents: read
      packages: read
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Image Digest
        id: image
        env:
          IMAGE_BASE: ${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}
          SHA_SHORT: ${{ needs.guard.outputs.sha_short }}
        run: |
          IMAGE_TAG="${IMAGE_BASE}:${SHA_SHORT}"

          # Vérifier que l'image existe avant de tenter le déploiement
          # (évite un déploiement silencieux avec une ref inexistante sur workflow_dispatch)
          if ! docker manifest inspect "$IMAGE_TAG" > /dev/null 2>&1; then
            echo "::error::Image not found in registry: $IMAGE_TAG"
            echo "Ensure CI has built and pushed the image for commit ${SHA_SHORT} before running CD manually."
            exit 1
          fi

          DIGEST=$(docker manifest inspect "$IMAGE_TAG" --verbose 2>/dev/null | jq -r '.Descriptor.digest' || echo "")
          if [[ -n "$DIGEST" ]]; then
            echo "digest=${IMAGE_BASE}@${DIGEST}" >> $GITHUB_OUTPUT
          else
            echo "digest=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Staging
        id: deploy
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`${{ steps.image.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.release.outputs.new_release_version || needs.guard.outputs.sha_short }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Method" >> $GITHUB_STEP_SUMMARY
          echo "- GitOps (ArgoCD/Flux)" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: staging" >> $GITHUB_STEP_SUMMARY

          # TODO: Ajouter ici la commande de déploiement réel
          # kubectl set image deployment/1min-gateway app=${{ steps.image.outputs.digest }} -n staging
          # kubectl rollout status deployment/1min-gateway -n staging --timeout=300s

          echo "deployed=true" >> $GITHUB_OUTPUT
          echo "Staging deployment triggered" >> $GITHUB_STEP_SUMMARY

  # ==============================================================
  # STAGE 3: SMOKE TESTS
  # ==============================================================
  smoke-test:
    name: "Smoke Tests"
    needs: deploy-staging
    if: needs.deploy-staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate environment URLs
        run: |
          if [[ -z "${{ env.STAGING_URL }}" ]]; then
            echo "::error::STAGING_URL variable is not set. Configure it in Settings → Variables."
            exit 1
          fi

      - name: Wait for deployment
        run: sleep 30

      - name: Health Check
        id: health
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          HEALTH_OK=false
          for i in {1..10}; do
            if curl -sf --max-time 10 "${{ env.STAGING_URL }}/health" > /dev/null 2>&1; then
              HEALTH_OK=true
              break
            fi
            sleep 10
          done
          [[ "$HEALTH_OK" == "true" ]] && echo "Health endpoint: OK" >> $GITHUB_STEP_SUMMARY || echo "Health endpoint: FAILED" >> $GITHUB_STEP_SUMMARY
          echo "health_ok=$HEALTH_OK" >> $GITHUB_OUTPUT

      - name: API Version Check
        id: version
        run: |
          RESPONSE=$(curl -sf --max-time 10 "${{ env.STAGING_URL }}/v1/version" 2>/dev/null || echo "")
          if [[ -n "$RESPONSE" ]]; then
            echo "Version endpoint: OK — $RESPONSE" >> $GITHUB_STEP_SUMMARY
            echo "version_ok=true" >> $GITHUB_OUTPUT
          else
            echo "Version endpoint: Not available" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Smoke Test Summary
        run: |
          PASSED=0
          [[ "${{ steps.health.outputs.health_ok }}" == "true" ]] && ((PASSED++))
          [[ "${{ steps.version.outputs.version_ok }}" == "true" ]] && ((PASSED++))
          echo "Smoke tests passed: $PASSED/2" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.health.outputs.health_ok }}" != "true" ]]; then
            echo "::error::Staging health check failed — deployment may be broken"
            exit 1
          fi

  # ==============================================================
  # STAGE 4: NOTIFICATION
  # ==============================================================
  notify:
    name: "Notify"
    needs: [guard, release, deploy-staging, smoke-test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Deployment Report
        run: |
          if [[ "${{ needs.smoke-test.result }}" == "success" ]]; then
            STATUS="Staging deployment successful — smoke tests passed"
          elif [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            STATUS="Staging deployment successful (smoke tests skipped)"
          elif [[ "${{ needs.guard.result }}" != "success" ]]; then
            STATUS="Skipped — CI did not pass"
          else
            STATUS="Staging deployment failed"
          fi

          echo "## CD Staging — $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Guard | ${{ needs.guard.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.release.outputs.new_release_version || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA**: ${{ needs.guard.outputs.sha_short }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ env.STAGING_URL }}" >> $GITHUB_STEP_SUMMARY
