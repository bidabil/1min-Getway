# ==============================================================
# CD Staging Pipeline - 1min-Gateway
# ==============================================================
# Déploiement automatique sur l'environnement staging
# - Déclenché après un push sur main qui passe le CI
# - Inclut les smoke tests
# ==============================================================

name: CD - Staging

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: "Enable debug mode"
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: cd-staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Ne pas annuler un déploiement en cours

env:
  REGISTRY_GHCR: ghcr.io
  GHCR_IMAGE: ${{ github.repository_owner }}/1min-gateway
  STAGING_URL: https://staging.1min-gateway.example.com

permissions:
  contents: read
  packages: read

jobs:
  # ==============================================================
  # STAGE 1: CI (réutilisation du workflow CI)
  # ==============================================================
  ci:
    name: "CI"
    uses: ./.github/workflows/ci.yml
    secrets: inherit  # pragma: allowlist secret
    with:
      skip_tests: false
      upload_artifacts: true

  # ==============================================================
  # STAGE 2: RELEASE (Semantic Release)
  # ==============================================================
  release:
    name: "Semantic Release"
    needs: ci
    if: |
      github.ref == 'refs/heads/main' &&
      needs.ci.outputs.quality_passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "## New Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_STEP_SUMMARY

  # ==============================================================
  # STAGE 3: DEPLOY STAGING
  # ==============================================================
  deploy-staging:
    name: "Deploy Staging"
    needs: [ci, release]
    if: |
      always() &&
      !cancelled() &&
      needs.ci.outputs.quality_passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    permissions:
      contents: read
      packages: read
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      image_digest: ${{ steps.deploy.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Image Digest
        id: image
        run: |
          # Récupérer le digest de l'image qui vient d'être build
          DIGEST=$(docker manifest inspect ${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}:${{ needs.ci.outputs.sha_short }} --verbose 2>/dev/null | jq -r '.Descriptor.digest' || echo "")
          if [[ -z "$DIGEST" ]]; then
            # Fallback sur le tag sha_short
            echo "digest=${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}:${{ needs.ci.outputs.sha_short }}" >> $GITHUB_OUTPUT
          else
            echo "digest=${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}@${DIGEST}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Staging
        id: deploy
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`${{ steps.image.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.release.outputs.new_release_version || needs.ci.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Method" >> $GITHUB_STEP_SUMMARY
          echo "- GitOps (ArgoCD/Flux)" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # TODO: Ajouter ici la commande de déploiement réel
          # Exemple avec kubectl:
          # kubectl set image deployment/1min-gateway app=${{ steps.image.outputs.digest }} -n staging
          # kubectl rollout status deployment/1min-gateway -n staging --timeout=300s

          echo "deployed=true" >> $GITHUB_OUTPUT
          echo "image_digest=${{ steps.image.outputs.digest }}" >> $GITHUB_OUTPUT

          echo "Staging deployment triggered" >> $GITHUB_STEP_SUMMARY

  # ==============================================================
  # STAGE 4: SMOKE TESTS
  # ==============================================================
  smoke-test:
    name: "Smoke Tests"
    needs: [ci, deploy-staging]
    if: needs.deploy-staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for deployment
        run: sleep 30

      - name: Health Check
        id: health
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Health Check" >> $GITHUB_STEP_SUMMARY
          for i in {1..10}; do
            if curl -sf --max-time 10 "${{ env.STAGING_URL }}/health" > /dev/null 2>&1; then
              echo "Health endpoint: OK" >> $GITHUB_STEP_SUMMARY
              echo "health_ok=true" >> $GITHUB_OUTPUT
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          if [[ "${{ steps.health.outputs.health_ok }}" != "true" ]]; then
            echo "Health endpoint: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "health_ok=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Readiness Check
        id: ready
        run: |
          echo "### Readiness Check" >> $GITHUB_STEP_SUMMARY
          for i in {1..5}; do
            if curl -sf --max-time 10 "${{ env.STAGING_URL }}/ready" > /dev/null 2>&1; then
              echo "Readiness endpoint: OK" >> $GITHUB_STEP_SUMMARY
              echo "ready_ok=true" >> $GITHUB_OUTPUT
              break
            fi
            sleep 5
          done

          if [[ "${{ steps.ready.outputs.ready_ok }}" != "true" ]]; then
            echo "Readiness endpoint: Not available (may be expected)" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: API Version Check
        id: version
        run: |
          echo "### API Version Check" >> $GITHUB_STEP_SUMMARY
          RESPONSE=$(curl -sf --max-time 10 "${{ env.STAGING_URL }}/v1/version" 2>/dev/null || echo "")
          if [[ -n "$RESPONSE" ]]; then
            echo "Version endpoint: OK" >> $GITHUB_STEP_SUMMARY
            echo "Response: \`$RESPONSE\`" >> $GITHUB_STEP_SUMMARY
            echo "version_ok=true" >> $GITHUB_OUTPUT
          else
            echo "Version endpoint: Not available" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Models Endpoint Check
        id: models
        run: |
          echo "### Models Endpoint Check" >> $GITHUB_STEP_SUMMARY
          if curl -sf --max-time 10 "${{ env.STAGING_URL }}/v1/models" > /dev/null 2>&1; then
            echo "Models endpoint: OK" >> $GITHUB_STEP_SUMMARY
            echo "models_ok=true" >> $GITHUB_OUTPUT
          else
            echo "Models endpoint: Not available (may require auth)" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Smoke Test Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary" >> $GITHUB_STEP_SUMMARY

          PASSED=0
          TOTAL=4

          [[ "${{ steps.health.outputs.health_ok }}" == "true" ]] && ((PASSED++))
          [[ "${{ steps.ready.outputs.ready_ok }}" == "true" ]] && ((PASSED++))
          [[ "${{ steps.version.outputs.version_ok }}" == "true" ]] && ((PASSED++))
          [[ "${{ steps.models.outputs.models_ok }}" == "true" ]] && ((PASSED++))

          echo "Smoke tests passed: $PASSED/$TOTAL" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.health.outputs.health_ok }}" != "true" ]]; then
            echo "::warning::Health check failed - deployment may have issues"
          fi

  # ==============================================================
  # STAGE 5: NOTIFICATION
  # ==============================================================
  notify:
    name: "Notify"
    needs: [ci, release, deploy-staging, smoke-test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.smoke-test.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=Staging deployment successful - smoke tests passed" >> $GITHUB_OUTPUT
            echo "color=#36a64f" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=Staging deployment successful (smoke tests skipped/inconclusive)" >> $GITHUB_OUTPUT
            echo "color=#ffc107" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.ci.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=CI failed - staging deployment cancelled" >> $GITHUB_OUTPUT
            echo "color=#dc3545" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Staging deployment failed" >> $GITHUB_OUTPUT
            echo "color=#dc3545" >> $GITHUB_OUTPUT
          fi

      - name: Deployment Report
        run: |
          echo "## Staging Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ steps.status.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI | CI Pipeline | ${{ needs.ci.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | Semantic Release | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Smoke Tests | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.release.outputs.new_release_version || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ needs.ci.outputs.sha_short }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ env.STAGING_URL }}" >> $GITHUB_STEP_SUMMARY
