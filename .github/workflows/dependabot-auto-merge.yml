name: Dependabot Auto-Merge

# ============================================================
# Ce workflow automatise l'approbation et le merge des PRs Dependabot
# selon des règles de sécurité strictes.
#
# RÈGLES D'AUTO-MERGE:
# Auto-merge : Patch dev deps
# Approve only : Minor dev deps  ← peut changer comportement (fixtures, API interne)
# Approve only : Patch prod deps ← review humaine requise
# Approve only : Minor prod deps
# Approve only : Major (tous)
# Fallback    : PR en limbo → commentaire explicatif
# Block       : CI fails
#
# NOTE: wait-on-check-action supprimé — `gh pr merge --auto` attend nativement
# les required checks via la branch protection (Settings → Branches).
# Réduire les faux positifs et la consommation de runner-minutes.
# ============================================================

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # ============================================================
  # JOB 1: Vérifier si la PR vient de Dependabot + récupérer metadata
  # ============================================================
  check-dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update-type:      ${{ steps.metadata.outputs.update-type }}
      dependency-type:  ${{ steps.metadata.outputs.dependency-type }}
      dependency-names: ${{ steps.metadata.outputs.dependency-names }}
      alert-state:      ${{ steps.metadata.outputs.alert-state }}

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display PR info
        env:
          UPDATE_TYPE:      ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_TYPE:  ${{ steps.metadata.outputs.dependency-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          ALERT_STATE:      ${{ steps.metadata.outputs.alert-state }}
        run: |
          echo "Dependabot PR detected"
          echo "Update type:      $UPDATE_TYPE"
          echo "Dependency type:  $DEPENDENCY_TYPE"
          echo "Dependency names: $DEPENDENCY_NAMES"
          echo "Alert state:      ${ALERT_STATE:-none}"

      # Garantit qu'aucun commit externe n'a été injecté sur la branche Dependabot
      # après sa création (PR takeover). Tout commit hors dependabot[bot] bloque le merge.
      - name: Verify all commits from dependabot[bot]
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # L'API GitHub retourne login="" pour les bots — utiliser .name à la place
          # --repo requis : pas de checkout dans ce job, gh ne peut pas inférer le contexte git
          NON_BOT=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json commits \
            --jq '[.commits[].authors[].name] | map(select(. != "dependabot[bot]")) | length')
          if [[ "$NON_BOT" -gt 0 ]]; then
            echo "::error::PR contains $NON_BOT commit(s) not authored by dependabot[bot] — aborting auto-merge"
            exit 1
          fi
          echo "All commits verified from dependabot[bot]"

  # ============================================================
  # JOB 2: Auto-approve et merge selon les règles
  # ============================================================
  auto-merge:
    needs: check-dependabot
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 10
    permissions:
      contents: write       # requis pour gh pr merge (squash)
      pull-requests: write  # requis pour gh pr review + gh pr comment

    steps:
      # ============================================================
      # PRIORITÉ SÉCURITÉ : Flaguer les mises à jour liées à une CVE
      # Indépendant des règles de merge — ajoute visibilité immédiate.
      # ============================================================
      - name: Flag security advisory updates
        if: needs.check-dependabot.outputs.alert-state == 'open'
        env:
          PR_URL:           ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ needs.check-dependabot.outputs.dependency-names }}
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Security advisory update detected — adding priority comment"
          gh pr comment "$PR_URL" \
            --body "**Security Advisory Update** — This PR was triggered by an open security vulnerability. Please review and merge promptly.\n\nAffected: \`$DEPENDENCY_NAMES\`"

      # ============================================================
      # RÈGLE 1 : Auto-merge des patchs dev
      # ============================================================
      - name: Auto-merge patch dev dependencies
        if: |
          needs.check-dependabot.outputs.update-type == 'version-update:semver-patch' &&
          needs.check-dependabot.outputs.dependency-type != 'direct:production'
        env:
          PR_URL:           ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Patch dev dependency — auto-approving and merging"
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"

      # ============================================================
      # RÈGLE 2 : Approve-only des mises à jour mineures dev
      # Minor peut introduire des changements de comportement (fixtures, API interne) —
      # 30 secondes de regard humain suffisent à détecter un problème.
      # ============================================================
      - name: Approve (but do not merge) minor dev dependencies
        if: |
          needs.check-dependabot.outputs.update-type == 'version-update:semver-minor' &&
          needs.check-dependabot.outputs.dependency-type == 'direct:development'
        env:
          PR_URL:           ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ needs.check-dependabot.outputs.dependency-names }}
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Minor dev dependency — approving but NOT auto-merging (human review required)"
          gh pr review --approve "$PR_URL" \
            --body "CI passed. This is a **minor dev update** — please review before merging.\n\n📦 Updated: $DEPENDENCY_NAMES"

      # ============================================================
      # RÈGLE 3 : Approve-only des patchs prod (review humaine requise)
      # Un patch compromis sur requests/pydantic ne doit pas passer sans review.
      # ============================================================
      - name: Approve (but do not merge) production patches
        if: |
          needs.check-dependabot.outputs.update-type == 'version-update:semver-patch' &&
          needs.check-dependabot.outputs.dependency-type == 'direct:production'
        env:
          PR_URL:           ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ needs.check-dependabot.outputs.dependency-names }}
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Production patch — approving but NOT auto-merging (human review required)"
          gh pr review --approve "$PR_URL" \
            --body "CI passed. This is a **production patch** — please review before merging.\n\n📦 Updated: $DEPENDENCY_NAMES"

      # ============================================================
      # RÈGLE 4 : Approve-only des mises à jour mineures prod
      # ============================================================
      - name: Approve (but do not merge) minor production updates
        if: |
          needs.check-dependabot.outputs.update-type == 'version-update:semver-minor' &&
          needs.check-dependabot.outputs.dependency-type == 'direct:production'
        env:
          PR_URL:           ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ needs.check-dependabot.outputs.dependency-names }}
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Minor production update — approving but NOT auto-merging"
          gh pr review --approve "$PR_URL" \
            --body "CI passed. This is a **minor production update** — please review before merging.\n\n📦 Updated: $DEPENDENCY_NAMES"

      # ============================================================
      # RÈGLE 5 : Approve-only des mises à jour majeures
      # ============================================================
      - name: Approve (but do not merge) major updates
        if: |
          needs.check-dependabot.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL:           ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ needs.check-dependabot.outputs.dependency-names }}
          DEPENDENCY_TYPE:  ${{ needs.check-dependabot.outputs.dependency-type }}
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Major update — approving but NOT auto-merging (manual review REQUIRED)"
          gh pr review --approve "$PR_URL" \
            --body "**MAJOR VERSION UPDATE** — CI passed but manual review is required.\n\n📦 Updated: $DEPENDENCY_NAMES ($DEPENDENCY_TYPE)\n\n**Checklist:**\n- [ ] Review breaking changes in release notes\n- [ ] Test locally\n- [ ] Update code if necessary\n- [ ] Merge manually when ready"

      # ============================================================
      # RÈGLE 6 : Fallback — update-type non couvert
      # Évite les PRs en limbo sans action ni commentaire.
      # ============================================================
      - name: Fallback for uncovered update types
        if: |
          needs.check-dependabot.outputs.update-type != 'version-update:semver-patch' &&
          needs.check-dependabot.outputs.update-type != 'version-update:semver-minor' &&
          needs.check-dependabot.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL:      ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ needs.check-dependabot.outputs.update-type }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Unrecognized update type: $UPDATE_TYPE — leaving for manual review"
          gh pr comment "$PR_URL" \
            --body "This Dependabot PR has an unrecognized update type (\`$UPDATE_TYPE\`) and was not auto-merged. Please review manually."

# ============================================================
# CONFIGURATION REQUISE
# ============================================================
# 1. Activer "Allow auto-merge" dans Settings → General
# 2. Configurer branch protection sur 'main' :
#    - Require status checks: "CI / Quality Gate"  ← gh pr merge --auto attend ce check
#    - Require approvals: 1 (satisfait par ce workflow)
#    - Ne PAS activer "Dismiss stale reviews on push" (boucle infinie avec --auto)
# 3. (Optionnel) Ajouter SLACK_WEBHOOK_URL dans les secrets
# ============================================================
