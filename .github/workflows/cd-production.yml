# ==============================================================
# CD Production Pipeline - 1min-Gateway
# ==============================================================
# Déploiement sur l'environnement production
# - Déclenchement manuel uniquement (workflow_dispatch)
# - Nécessite une approbation via l'environnement GitHub
# - Déploie la version validée sur staging
# ==============================================================

name: CD - Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (tag, sha, or 'latest' for latest release)"
        type: string
        default: "latest"
        required: true
      skip_staging_check:
        description: "Skip staging validation check (emergency only)"
        type: boolean
        default: false

concurrency:
  group: cd-production-${{ github.workflow }}
  cancel-in-progress: false  # Ne jamais annuler un déploiement production

env:
  REGISTRY_GHCR: ghcr.io
  GHCR_IMAGE: ${{ github.repository_owner }}/1min-gateway
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
  STAGING_URL: ${{ vars.STAGING_URL }}

permissions:
  contents: read
  packages: read

jobs:
  # ==============================================================
  # STAGE 1: VALIDATE INPUT
  # ==============================================================
  validate:
    name: "Validate Input"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      image_ref: ${{ steps.resolve.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_SKIP_CHECK: ${{ github.event.inputs.skip_staging_check }}
        run: |
          echo "## Production Deployment Request" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Requested Version**: $INPUT_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Skip Staging Check**: $INPUT_SKIP_CHECK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          VERSION="$INPUT_VERSION"

          if [[ "$VERSION" == "latest" ]]; then
            # Récupérer le dernier tag
            git fetch --tags
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [[ -z "$LATEST_TAG" ]]; then
              echo "No tags found in repository" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            VERSION="${LATEST_TAG#v}"  # Retirer le 'v' prefix si présent
            echo "Resolved to latest tag: $LATEST_TAG (version: $VERSION)"
          fi

          # Déterminer le tag d'image
          if [[ "$INPUT_VERSION" == "latest" ]]; then
            IMAGE_TAG="latest"
          else
            IMAGE_TAG="$VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image_ref=${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

          echo "**Resolved Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: ${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE }}:$IMAGE_TAG" >> $GITHUB_STEP_SUMMARY

      - name: Verify Image Exists
        run: |
          # Vérifier que l'image existe dans le registry
          if ! docker manifest inspect ${{ steps.resolve.outputs.image_ref }} > /dev/null 2>&1; then
            echo "Image not found: ${{ steps.resolve.outputs.image_ref }}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Image verified in registry" >> $GITHUB_STEP_SUMMARY

  # ==============================================================
  # STAGE 2: STAGING VALIDATION (optionnel)
  # ==============================================================
  staging-check:
    name: "Staging Validation"
    needs: validate
    if: github.event.inputs.skip_staging_check != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate environment URLs
        run: |
          if [[ -z "${{ env.STAGING_URL }}" ]]; then
            echo "::error::STAGING_URL variable is not set. Configure it in Settings → Variables."
            exit 1
          fi

      - name: Check Staging Health
        run: |
          echo "## Staging Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Vérifier que staging est healthy
          for i in {1..3}; do
            if curl -sf --max-time 10 "${{ env.STAGING_URL }}/health" > /dev/null 2>&1; then
              echo "Staging is healthy" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done

          echo "Staging health check failed" >> $GITHUB_STEP_SUMMARY
          echo "::error::Staging environment is not healthy. Fix staging before deploying to production."
          exit 1

      - name: Verify Staging Version
        run: |
          # Optionnel: vérifier que la version sur staging correspond
          STAGING_VERSION=$(curl -sf --max-time 10 "${{ env.STAGING_URL }}/v1/version" 2>/dev/null | jq -r '.version' || echo "unknown")
          echo "Staging version: $STAGING_VERSION"
          echo "Requested version: ${{ needs.validate.outputs.version }}"

          if [[ "$STAGING_VERSION" == "${{ needs.validate.outputs.version }}" ]]; then
            echo "Version matches staging" >> $GITHUB_STEP_SUMMARY
          else
            echo "Version mismatch with staging (continuing anyway)" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  # ==============================================================
  # STAGE 3: DEPLOY PRODUCTION
  # ==============================================================
  deploy-production:
    name: "Deploy Production"
    needs: [validate, staging-check]
    if: |
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      (needs.staging-check.result == 'success' || github.event.inputs.skip_staging_check == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    permissions:
      contents: read
      packages: read
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Production
        id: deploy
        env:
          IMAGE_DIGEST: ${{ needs.validate.outputs.image_ref }}
          VERSION: ${{ needs.validate.outputs.version }}
          DEPLOYED_BY: ${{ github.actor }}
          SKIP_CHECK: ${{ github.event.inputs.skip_staging_check }}
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`$IMAGE_DIGEST\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed By**: $DEPLOYED_BY" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$SKIP_CHECK" == "true" ]]; then
            echo "**WARNING**: Staging validation was skipped!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "Staging validation passed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Method" >> $GITHUB_STEP_SUMMARY
          echo "- GitOps (ArgoCD/Flux)" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # TODO: Ajouter ici la commande de déploiement réel
          # Exemple avec kubectl:
          # kubectl set image deployment/1min-gateway app=${{ needs.validate.outputs.image_ref }} -n production
          # kubectl rollout status deployment/1min-gateway -n production --timeout=600s

          echo "deployed=true" >> $GITHUB_OUTPUT

          echo "Production deployment triggered" >> $GITHUB_STEP_SUMMARY

  # ==============================================================
  # STAGE 4: PRODUCTION SMOKE TESTS
  # ==============================================================
  smoke-test:
    name: "Production Smoke Tests"
    needs: [validate, deploy-production]
    if: needs.deploy-production.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate environment URLs
        run: |
          if [[ -z "${{ env.PRODUCTION_URL }}" ]]; then
            echo "::error::PRODUCTION_URL variable is not set. Configure it in Settings → Variables."
            exit 1
          fi

      - name: Wait for deployment
        run: sleep 60  # Attendre plus longtemps pour production

      - name: Health Check
        id: health
        run: |
          echo "## Production Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Health Check" >> $GITHUB_STEP_SUMMARY
          HEALTH_OK=false
          for i in {1..15}; do
            if curl -sf --max-time 10 "${{ env.PRODUCTION_URL }}/health" > /dev/null 2>&1; then
              echo "Health endpoint: OK" >> $GITHUB_STEP_SUMMARY
              HEALTH_OK=true
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          if [[ "$HEALTH_OK" != "true" ]]; then
            echo "Health endpoint: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          echo "health_ok=$HEALTH_OK" >> $GITHUB_OUTPUT

      - name: Readiness Check
        id: ready
        run: |
          echo "### Readiness Check" >> $GITHUB_STEP_SUMMARY
          READY_OK=false
          for i in {1..10}; do
            if curl -sf --max-time 10 "${{ env.PRODUCTION_URL }}/ready" > /dev/null 2>&1; then
              echo "Readiness endpoint: OK" >> $GITHUB_STEP_SUMMARY
              READY_OK=true
              break
            fi
            sleep 5
          done

          if [[ "$READY_OK" != "true" ]]; then
            echo "Readiness endpoint: Not available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "ready_ok=$READY_OK" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: API Version Check
        id: version
        run: |
          echo "### API Version Check" >> $GITHUB_STEP_SUMMARY
          RESPONSE=$(curl -sf --max-time 10 "${{ env.PRODUCTION_URL }}/v1/version" 2>/dev/null || echo "")
          if [[ -n "$RESPONSE" ]]; then
            echo "Version endpoint: OK" >> $GITHUB_STEP_SUMMARY
            echo "Response: \`$RESPONSE\`" >> $GITHUB_STEP_SUMMARY
            echo "version_ok=true" >> $GITHUB_OUTPUT
          else
            echo "Version endpoint: Not available" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Smoke Test Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary" >> $GITHUB_STEP_SUMMARY

          PASSED=0
          TOTAL=3

          [[ "${{ steps.health.outputs.health_ok }}" == "true" ]] && ((PASSED++))
          [[ "${{ steps.ready.outputs.ready_ok }}" == "true" ]] && ((PASSED++))
          [[ "${{ steps.version.outputs.version_ok }}" == "true" ]] && ((PASSED++))

          echo "Smoke tests passed: $PASSED/$TOTAL" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.health.outputs.health_ok }}" != "true" ]]; then
            echo "::error::Production health check failed - immediate attention required!"
            exit 1
          fi

  # ==============================================================
  # STAGE 5: ROLLBACK NOTIFICATION (si échec)
  # ==============================================================
  rollback-check:
    name: "Rollback Check"
    needs: [validate, deploy-production, smoke-test]
    if: |
      always() &&
      !cancelled() &&
      needs.deploy-production.outputs.deployed == 'true' &&
      needs.smoke-test.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Rollback Warning
        run: |
          echo "## ROLLBACK REQUIRED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production smoke tests failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Immediate Action Required:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Investigate the failure in production logs" >> $GITHUB_STEP_SUMMARY
          echo "2. Consider rolling back to previous version" >> $GITHUB_STEP_SUMMARY
          echo "3. Notify the team immediately" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed Version**: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: ${{ needs.validate.outputs.image_ref }}" >> $GITHUB_STEP_SUMMARY

          # TODO: Ajouter commande de rollback automatique si nécessaire
          # kubectl rollout undo deployment/1min-gateway -n production

          echo "::error::Production deployment failed smoke tests - manual intervention required"

  # ==============================================================
  # STAGE 6: NOTIFICATION
  # ==============================================================
  notify:
    name: "Notify"
    needs: [validate, staging-check, deploy-production, smoke-test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.smoke-test.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=Production deployment successful - all smoke tests passed" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy-production.result }}" == "success" && "${{ needs.smoke-test.result }}" == "skipped" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=Production deployment completed (smoke tests skipped)" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.validate.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Validation failed - deployment cancelled" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.staging-check.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Staging validation failed - deployment cancelled" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.smoke-test.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Production deployment failed - smoke tests failed" >> $GITHUB_OUTPUT
          else
            echo "status=unknown" >> $GITHUB_OUTPUT
            echo "message=Production deployment pipeline completed" >> $GITHUB_OUTPUT
          fi

      - name: Deployment Report
        run: |
          echo "## Production Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ steps.status.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | Input Validation | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Staging Validation | ${{ needs.staging-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | Production | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Smoke Tests | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ needs.validate.outputs.image_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ env.PRODUCTION_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
