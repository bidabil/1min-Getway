# ==============================================================
# CI Security - 1min-Gateway
# ==============================================================
# Scans de sécurité : SAST, OSV, dépendances, Scorecard.
# Appelé depuis ci.yml (advisory — ne bloque pas le quality gate).
# Les scans planifiés passent par ci.yml qui fournit is_scheduled: true.
# ==============================================================

name: CI - Security

on:
  workflow_call:
    inputs:
      is_draft:
        description: "Is draft PR"
        type: boolean
        default: false
      changes_src:
        description: "Source files changed"
        type: boolean
        default: true
      changes_deps:
        description: "Dependency files changed"
        type: boolean
        default: true
      is_pr:
        description: "Is a pull request"
        type: boolean
        default: false
      is_scheduled:
        description: "Triggered by schedule"
        type: boolean
        default: false
  # NOTE: pas de trigger schedule ici — ci.yml orchestre déjà les
  # scans planifiés et passe is_scheduled: true.  Évite les doublons.

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  # ==============================================================
  # SAST : Ruff Security Rules + Semgrep + CodeQL
  # ==============================================================
  security-sast:
    name: "SAST Scan"
    if: |
      !inputs.is_draft &&
      (inputs.changes_src || inputs.is_scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff Security Rules
        run: |
          pip install ruff
          ruff check . --select S --output-format=github

      - name: Semgrep Scan
        # CLI directe : semgrep-action v1 ne produit pas de fichier SARIF uploadable séparément.
        # exit 0 sur findings (advisory) ; exit 2 sur erreur réelle.
        run: |
          pip install semgrep --quiet
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            . ; CODE=$?
          [[ $CODE -eq 2 ]] && exit 2 || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: CodeQL Initialize
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  # ==============================================================
  # OSV Scanner
  # ==============================================================
  osv-scan:
    name: "OSV Scanner"
    if: |
      !inputs.is_draft &&
      (inputs.changes_deps || inputs.is_scheduled)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.5
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      scan-args: |-
        --recursive
        --config=osv-scanner.toml
        ./

  # ==============================================================
  # Dependency Scan : pip-audit + safety
  # ==============================================================
  security-deps:
    name: "Dependency Scan"
    if: |
      !inputs.is_draft &&
      (inputs.changes_deps || inputs.is_scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # pip-audit sans installer les dépendances scannées (évite de contaminer l'env de scan).
      # safety supprimé : redondant avec pip-audit + OSV, et nécessite un compte payant.
      - run: pip install pip-audit

      - name: Pip Audit
        run: |
          pip-audit -r requirements.txt --format=json --output=pip-audit.json || true
          pip-audit -r requirements.txt --format=markdown >> $GITHUB_STEP_SUMMARY || true

      - name: Upload Security Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-scan-results
          path: pip-audit.json
          retention-days: 30

  # ==============================================================
  # Dependency Review (PRs uniquement)
  # ==============================================================
  dependency-review:
    name: "Dependency Review"
    if: inputs.is_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

  # ==============================================================
  # OpenSSF Scorecard (schedule uniquement)
  # ==============================================================
  scorecard:
    name: "OpenSSF Scorecard"
    if: inputs.is_scheduled
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: true

      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: scorecard.json
          retention-days: 30
