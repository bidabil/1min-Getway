# ==============================================================
# CI Pipeline - 1min-Gateway
# ==============================================================
# Orchestrateur principal : qualité, sécurité (advisory), build.
# Réutilisable depuis cd-staging.yml via workflow_call.
# ==============================================================

name: CI

on:
  workflow_call:
    inputs:
      skip_tests:
        description: "Skip tests (emergency only)"
        type: boolean
        default: false
      upload_artifacts:
        description: "Upload build artifacts"
        type: boolean
        default: true
    outputs:
      version:
        description: "Version built"
        value: ${{ jobs.init.outputs.version }}
      sha_short:
        description: "Short SHA"
        value: ${{ jobs.init.outputs.sha_short }}
      quality_passed:
        description: "Quality gate passed"
        value: ${{ jobs.quality-gate.outputs.passed }}
  pull_request:
    branches: ["main", "develop"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"
  schedule:
    - cron: "0 6 * * 1"   # Security scan every Monday 6 AM UTC
    - cron: "0 0 1 * *"   # Monthly full scan
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.8.0"
  MIN_COVERAGE: 75

permissions:
  contents: read

jobs:
  # ==============================================================
  # STAGE 0: INITIALIZATION
  # ==============================================================
  init:
    name: "Initialize"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha_short:     ${{ steps.vars.outputs.sha_short }}
      is_pr:         ${{ steps.vars.outputs.is_pr }}
      is_draft:      ${{ steps.vars.outputs.is_draft }}
      force_all:     ${{ steps.vars.outputs.force_all }}
      version:       ${{ steps.vars.outputs.version }}
      changes_src:   ${{ steps.changes.outputs.src }}
      changes_deps:  ${{ steps.changes.outputs.deps }}
      changes_ci:    ${{ steps.changes.outputs.ci }}
      changes_tests: ${{ steps.changes.outputs.tests }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "is_pr=${{ github.event_name == 'pull_request' }}" >> $GITHUB_OUTPUT
          echo "is_draft=${{ github.event.pull_request.draft }}" >> $GITHUB_OUTPUT
          echo "force_all=${{ github.event_name == 'workflow_dispatch' }}" >> $GITHUB_OUTPUT
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev+${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            src:
              - 'src/**'
              - 'main.py'
            deps:
              - 'requirements*.txt'
              - 'pyproject.toml'
              - 'poetry.lock'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
            tests:
              - 'tests/**'
              - 'pytest.ini'
              - 'conftest.py'

  # ==============================================================
  # STAGE 1: CODE QUALITY (Parallel)
  # ==============================================================
  lint:
    name: "Lint"
    needs: init
    if: |
      needs.init.outputs.is_draft != 'true' &&
      (needs.init.outputs.force_all == 'true' || needs.init.outputs.changes_src == 'true' || needs.init.outputs.changes_ci == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ruff-${{ env.RUFF_VERSION }}
      - run: pip install ruff==${{ env.RUFF_VERSION }}
      - name: Ruff Lint
        run: ruff check . --output-format=github
      - name: Ruff Format
        run: ruff format --check --diff .

  type-check:
    name: "Type Check"
    needs: init
    if: |
      needs.init.outputs.is_draft != 'true' &&
      (needs.init.outputs.force_all == 'true' || needs.init.outputs.changes_src == 'true' || needs.init.outputs.changes_deps == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install -r requirements.txt mypy types-requests types-cachetools
      - name: MyPy (Strict)
        run: mypy src/ --ignore-missing-imports --strict --pretty

  # ==============================================================
  # STAGE 2: TESTING (Matrix)
  # ==============================================================
  test:
    name: "Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})"
    needs: init
    if: |
      needs.init.outputs.is_draft != 'true' &&
      inputs.skip_tests != true &&
      (needs.init.outputs.force_all == 'true' || needs.init.outputs.changes_src == 'true' || needs.init.outputs.changes_deps == 'true' || needs.init.outputs.changes_tests == 'true' || github.event_name == 'schedule')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - { python-version: "3.12", os: ubuntu-latest,  coverage: true,  benchmark: true  }
          - { python-version: "3.12", os: windows-latest, coverage: false, benchmark: false }
    env:
      ONE_MIN_AI_API_KEY: "test-api-key-ci"      # pragma: allowlist secret
      SECRET_KEY: "test-secret-key-ci-only"      # pragma: allowlist secret
      APP_ENV: "testing"
      DEBUG: "True"
      RATELIMIT_ENABLED: "False"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-benchmark pytest-randomly pytest-asyncio

      - name: Run Tests with Coverage
        if: matrix.coverage
        run: |
          pytest tests/ -v \
            --cov=src --cov-report=term-missing \
            --cov-report=xml:coverage.xml --cov-report=html:htmlcov \
            --cov-fail-under=${{ env.MIN_COVERAGE }} \
            --junitxml=test-results.xml --timeout=60 \
            -n auto --randomly-seed=12345

      - name: Run Tests (no coverage)
        if: ${{ !matrix.coverage }}
        shell: bash
        run: pytest tests/ -v --junitxml=test-results.xml --timeout=60 -n auto

      - name: Run Benchmarks
        if: matrix.benchmark && github.event_name == 'pull_request'
        run: pytest tests/ -v --benchmark-only --benchmark-json=benchmark.json --benchmark-compare || true
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always() && (inputs.upload_artifacts == true || github.event_name != 'workflow_call')
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
            benchmark.json
          retention-days: 7

      - name: Upload Coverage to Codecov
        if: matrix.coverage && always()
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python-${{ matrix.python-version }}

      - name: Test Summary
        if: always() && matrix.os == 'ubuntu-latest'
        uses: test-summary/action@v2
        with:
          paths: test-results.xml

  # ==============================================================
  # STAGE 3: SECURITY (Parallel, advisory — délégué à ci-security.yml)
  # ==============================================================
  security:
    name: "Security"
    needs: init
    uses: ./.github/workflows/ci-security.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
      id-token: write
    with:
      is_draft:     ${{ needs.init.outputs.is_draft == 'true' }}
      changes_src:  ${{ needs.init.outputs.changes_src == 'true' || needs.init.outputs.force_all == 'true' }}
      changes_deps: ${{ needs.init.outputs.changes_deps == 'true' || needs.init.outputs.force_all == 'true' }}
      is_pr:        ${{ needs.init.outputs.is_pr == 'true' }}
      is_scheduled: ${{ github.event_name == 'schedule' }}

  # ==============================================================
  # STAGE 4: QUALITY GATE
  # ==============================================================
  quality-gate:
    name: "Quality Gate"
    needs: [init, lint, type-check, test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      passed: ${{ steps.evaluate.outputs.passed }}
    steps:
      - name: Evaluate
        id: evaluate
        run: |
          PASSED=true

          # Un job en failure fait échouer le gate
          [[ "${{ needs.lint.result }}"       == "failure" ]] && PASSED=false
          [[ "${{ needs.type-check.result }}" == "failure" ]] && PASSED=false
          [[ "${{ needs.test.result }}"       == "failure" ]] && PASSED=false

          # Si tous les jobs de qualité sont skippés, le gate échoue
          # (évite un build sans aucun check — ex: workflow_dispatch mal configuré)
          ALL_SKIPPED=true
          [[ "${{ needs.lint.result }}"       != "skipped" ]] && ALL_SKIPPED=false
          [[ "${{ needs.type-check.result }}" != "skipped" ]] && ALL_SKIPPED=false
          [[ "${{ needs.test.result }}"       != "skipped" ]] && ALL_SKIPPED=false
          if [[ "$ALL_SKIPPED" == "true" ]]; then
            echo "::error::All quality checks were skipped — no checks ran, gate cannot pass"
            PASSED=false
          fi

          echo "## Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint       | ${{ needs.lint.result }} |"       >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests      | ${{ needs.test.result }} |"       >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          [[ "$PASSED" == "true" ]] && echo "### PASSED" >> $GITHUB_STEP_SUMMARY || echo "### FAILED" >> $GITHUB_STEP_SUMMARY
          echo "passed=$PASSED" >> $GITHUB_OUTPUT

      - name: Fail if not passed
        if: steps.evaluate.outputs.passed != 'true'
        run: exit 1

  # ==============================================================
  # STAGE 5: BUILD & PUSH (délégué à ci-build.yml)
  # ==============================================================
  build-and-push:
    name: "Build & Push"
    needs: [init, quality-gate]
    if: always() && !cancelled() && needs.quality-gate.outputs.passed == 'true'
    uses: ./.github/workflows/ci-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      attestations: write
    with:
      version:    ${{ needs.init.outputs.version }}
      sha_short:  ${{ needs.init.outputs.sha_short }}
      event_name: ${{ github.event_name }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      CODECOV_TOKEN:   ${{ secrets.CODECOV_TOKEN }}

  # ==============================================================
  # STAGE 6: NOTIFICATION
  # ==============================================================
  notify:
    name: "Notify"
    needs: [init, lint, type-check, test, security, quality-gate, build-and-push]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Pipeline Report
        run: |
          if   [[ "${{ needs.build-and-push.result }}" == "success" ]]; then
            STATUS="Build successful"
          elif [[ "${{ needs.quality-gate.result }}" == "failure" ]]; then
            STATUS="Quality gate failed"
          elif [[ "${{ needs.init.outputs.is_pr }}" == "true" && "${{ needs.quality-gate.outputs.passed }}" == "true" ]]; then
            STATUS="PR checks passed"
          else
            STATUS="Pipeline completed"
          fi

          echo "## CI — $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "| Stage    | Job          | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality  | Lint         | ${{ needs.lint.result }} |"           >> $GITHUB_STEP_SUMMARY
          echo "| Quality  | Type Check   | ${{ needs.type-check.result }} |"     >> $GITHUB_STEP_SUMMARY
          echo "| Quality  | Tests        | ${{ needs.test.result }} |"           >> $GITHUB_STEP_SUMMARY
          echo "| Security | All Scans    | ${{ needs.security.result }} |"       >> $GITHUB_STEP_SUMMARY
          echo "| Gate     | Quality Gate | ${{ needs.quality-gate.result }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| Build    | Build & Push | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
