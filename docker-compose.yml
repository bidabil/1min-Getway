# ============================================================
# 1min-Gateway - Docker Compose
# ============================================================
# 1. cp .env.example .env   and fill ONE_MIN_API_KEY + GATEWAY_API_KEYS
#    (create a key: docker compose run --rm gateway python -m gateway.cli create-key my-agent)
# 2. docker compose up -d
#
# The port is bound to localhost: put a TLS reverse proxy (Caddy, Traefik, nginx) in
# front of it before exposing it to other machines. API keys must never travel in clear.
# ============================================================

services:
  gateway:
    image: ${GATEWAY_IMAGE:-billelattafi/1min-gateway:latest}
    build: .
    container_name: 1min-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-5001}:5001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gateway

networks:
  gateway:
    name: 1min-gateway-network
