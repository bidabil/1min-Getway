
# ============================================================
# Pre-commit - Configuration Optimisée
# ============================================================

repos:
  # RUFF - Lint + Format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Hooks standards
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  # Detect-secrets (sans baseline - mode simple)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --exclude-files
          - "package-lock\\.json$"
          - --exclude-files
          - "\\.secrets\\.baseline$"
          - --exclude-files
          - "\\.env\\.example$"

  # Hadolint is run in CI (ci.yml lint job) via hadolint-action — no local Docker required.

  # Commitlint avec Gitmoji
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"
          - "commitlint-config-gitmoji"

default_language_version:
  python: python3.12

exclude: |
  (?x)^(
    \.git/|\.venv/|venv/|__pycache__/|logs/|CHANGELOG\.md
  )$
